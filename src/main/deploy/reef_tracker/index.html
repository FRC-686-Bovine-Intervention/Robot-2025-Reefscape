<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReefTracker</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/reef.css" />
    <link rel="stylesheet" href="./styles/pipe.css" />
    <link rel="stylesheet" href="./styles/slider.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
  </head>
  <body>
    <div id="controls">
      <div class="toggle">
        <p>Dumb</p>
        <label class="switch">
          <input id="mode" type="checkbox" />
          <span class="slider round"></span>
        </label>
        <p>Smart</p>
      </div>
      <div id="priority_list">
        <p>Priority List <span class="updated">✅</span></p>
        <div data-swapy-slot="0">
          <div
            class="priority"
            data-swapy-item="0"
            data-idx="0"
            data-level="4"
            data-count="12"
          >
            <span>Level 4 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="1">
          <div
            class="priority"
            data-swapy-item="1"
            data-idx="1"
            data-level="3"
            data-count="12"
          >
            <span>Level 3 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="2">
          <div
            class="priority"
            data-swapy-item="2"
            data-idx="2"
            data-level="2"
            data-count="12"
          >
            <span>Level 2 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="3">
          <div
            class="priority"
            data-swapy-item="3"
            data-idx="3"
            data-level="1"
            data-count="12"
          >
            <span>Level 1 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="4">
          <div
            class="priority"
            data-swapy-item="4"
            data-idx="4"
            data-level="4"
            data-count="5"
          >
            <span>Level 4 Ranking Point</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="5">
          <div
            class="priority"
            data-swapy-item="5"
            data-idx="5"
            data-level="3"
            data-count="5"
          >
            <span>Level 3 Ranking Point</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="6">
          <div
            class="priority"
            data-swapy-item="6"
            data-idx="6"
            data-level="2"
            data-count="5"
          >
            <span>Level 2 Ranking Point</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="7">
          <div
            class="priority"
            data-swapy-item="7"
            data-idx="7"
            data-level="1"
            data-count="5"
          >
            <span>Level 1 Ranking Point</span><span class="progress-bar"></span>
          </div>
        </div>
      </div>
      <div id="algae_goal">
        <div class="primary">
          <div class="button" id="net">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-grid-3x3"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M3 9h18" />
              <path d="M3 15h18" />
              <path d="M9 3v18" />
              <path d="M15 3v18" />
            </svg>
            <span>Net</span>
          </div>
          <div class="button" id="processor">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-gallery-vertical"
            >
              <path d="M3 2h18" />
              <rect width="18" height="12" x="3" y="6" rx="2" />
              <path d="M3 22h18" />
            </svg>
            <span>Processor</span>
          </div>
        </div>
        <div class="secondary">
          <div class="button" id="opp_processor">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-gallery-vertical"
            >
              <path d="M3 2h18" />
              <rect width="18" height="12" x="3" y="6" rx="2" />
              <path d="M3 22h18" />
            </svg>
            <span>Opponent's Processor</span>
          </div>
        </div>
      </div>

          />
        </svg>
      </div>
    </div>
    <div id="tracker">
      <div id="reef">
        <div class="rack">
          <div class="pipes">
            <div class="pipe"><span class="pipe-text">A</span></div>
            <div class="pipe"><span class="pipe-text">B</span></div>
          </div>
          <div class="algae"><span class="algae-text">H</span></div>
        </div>
        <div class="rack">
          <div class="pipes">
            <div class="pipe"><span class="pipe-text">C</span></div>
            <div class="pipe"><span class="pipe-text">D</span></div>
          </div>
          <div class="algae"><span class="algae-text">L</span></div>
        </div>
        <div class="rack">
          <div class="pipes">
            <div class="pipe"><span class="pipe-text">E</span></div>
            <div class="pipe"><span class="pipe-text">F</span></div>
          </div>
          <div class="algae"><span class="algae-text">H</span></div>
        </div>
        <div class="rack">
          <div class="pipes">
            <div class="pipe"><span class="pipe-text">G</span></div>
            <div class="pipe"><span class="pipe-text">H</span></div>
          </div>
          <div class="algae"><span class="algae-text">L</span></div>
        </div>
        <div class="rack">
          <div class="pipes">
            <div class="pipe"><span class="pipe-text">I</span></div>
            <div class="pipe"><span class="pipe-text">J</span></div>
          </div>
          <div class="algae"><span class="algae-text">H</span></div>
        </div>
        <div class="rack">
          <div class="pipes">
            <div class="pipe"><span class="pipe-text">K</span></div>
            <div class="pipe"><span class="pipe-text">L</span></div>
          </div>
          <div class="algae"><span class="algae-text">L</span></div>
        </div>
      </div>

</html>
